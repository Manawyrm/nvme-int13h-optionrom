name: Build

on:
  create: { }
  pull_request: { }

permissions:
  contents: write

jobs:
  x86:
    name: x86
    runs-on: ubuntu-24.04
    steps:
      - name: Download packages
        run: |
          sudo apt update
          sudo apt install -y mtools syslinux isolinux liblzma-dev genisoimage

      - name: Check out code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: git tag (workaround)
        run: git tag -f v0.0.1

      - name: Build (BIOS)
        run: |
          make NO_WERROR=1 -j $(nproc) -C src
          make NO_WERROR=1 -j $(nproc) -C src bin/11ab4351.rom
          make NO_WERROR=1 -j $(nproc) -C src bin/19692048.rom

      - name: Rename images
        run: |
          mv ./src/bin/ipxe.dsk ./src/bin/nvmeboot.dsk
          mv ./src/bin/ipxe.lkrn ./src/bin/nvmeboot.lkrn
          mv ./src/bin/ipxe.pxe ./src/bin/nvmeboot.pxe
          mv ./src/bin/ipxe.usb ./src/bin/nvmeboot.usb

      - name: Build (1.44M floppy image)
        run: |
          dd if=/dev/zero of=./src/bin/nvmeboot.ima bs=1440k count=1
          dd if=./src/bin/nvmeboot.dsk of=./src/bin/nvmeboot.ima conv=notrunc

      - name: Release build artifacts
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ./src/bin/nvmeboot.dsk
            ./src/bin/nvmeboot.lkrn
            ./src/bin/nvmeboot.pxe
            ./src/bin/nvmeboot.usb
            ./src/bin/nvmeboot.ima
            ./src/bin/undionly.kpxe
            ./src/bin/rtl8139.rom
            ./src/bin/8086100e.mrom
            ./src/bin/80861209.rom
            ./src/bin/10500940.rom
            ./src/bin/10222000.rom
            ./src/bin/10ec8139.rom
            ./src/bin/1af41000.rom
            ./src/bin/8086100f.mrom
            ./src/bin/808610d3.mrom
            ./src/bin/15ad07b0.rom
            ./src/bin/11ab4351.rom
            ./src/bin/19692048.rom
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
